<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پرده سرای نورزاد</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Vazirmatn, sans-serif;
    background:
    linear-gradient(rgba(10,20,40,.85),rgba(10,20,40,.95)),
    url("https://images.unsplash.com/photo-1616486338812-3dadae4b4ace");
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{

    width:100%;
    max-width:420px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(15px);
    border-radius:30px;
    padding:35px 25px;
    text-align:center;
    color:white;
    box-shadow:0 20px 50px rgba(0,0,0,.3);

    animation:show 1s ease;
}

@keyframes show{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}


.logo{
    font-size:45px;
    margin-bottom:10px;
}

h1{
    margin:0;
    font-size:30px;
    color:#d8b35a;
}

.subtitle{
    margin-top:10px;
    color:#eee;
    font-size:16px;
}


.buttons{
    margin-top:30px;
    display:flex;
    flex-direction:column;
    gap:15px;
}


.btn{

    display:block;
    padding:15px;
    border-radius:18px;
    text-decoration:none;
    color:white;
    font-size:17px;
    transition:.3s;
    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.2);

}


.btn:hover{
    transform:scale(1.03);
}


.call{
    background:#168c4b;
}


.address{

    margin-top:30px;
    padding-top:25px;
    border-top:1px solid rgba(255,255,255,.3);
    line-height:2;
    font-size:15px;

}


.footer{

    margin-top:25px;
    color:#d8b35a;
    font-size:14px;

}

</style>

</head>


<body>


<div class="card">

<div class="logo">
🪟
</div>


<h1>
پرده سرای نورزاد
</h1>


<div class="subtitle">
طراحی • دوخت • نصب
</div>



<div class="buttons">


<a class="btn call" href="tel:09190664531">
📞 تماس با ما
</a>


<a class="btn" href="https://eitaa.com/pardnoorzad">
💬 کانال ایتا
</a>


<a class="btn" target="_blank" href="https://nshn.ir/ff_bsVmu5x7Z5t">
📍 مسیریابی فروشگاه
</a>


<a class="btn" href="tel:09190664531">
💾 ذخیره شماره
</a>


</div>




<div class="address">

📍 قم، بلوار یادگار امام<br>

خیابان شهید موسوی<br>

روبروی کوچه ۳۳

</div>


<div class="footer">
زیبایی خانه شما، تخصص ما ✨
</div>


</div>


</body>
</html>
